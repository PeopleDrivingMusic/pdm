name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `$env/static/private` and `$env/static/public` (SvelteKit) only export the
# keys that exist in the environment at sync/build time — the keys just need
# to exist (empty is fine), not carry real values. Without these, svelte-check
# fails on "has no exported member", and the client project's real-Chromium
# ESM import throws "does not provide an export named ..." at module load.
# Mirrors .env.example.
env:
  CLOUDFLARE_ACCOUNT_ID: ''
  R2_ACCESS_KEY_ID: ''
  R2_SECRET_ACCESS_KEY: ''
  PUBLIC_R2_IMAGES_BUCKET: ''
  PUBLIC_PGADMIN_URL: ''

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - 'drizzle/**'
              - 'src/lib/db/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run check

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit -- --run --project server

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: yarn test:unit -- --run --project client

  # Only runs when a PR/push actually touches migrations or the schema — a
  # plain UI/route change shouldn't pay for spinning up Postgres.
  db-migrate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: root
          POSTGRES_DB: pdm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://admin:root@localhost:5432/pdm_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Apply migrations to a fresh database
        run: yarn db:migrate
      - name: Verify schema.ts matches the migration journal (no drift)
        run: |
          yarn db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::drizzle-kit generate produced changes — schema.ts and the migration journal have drifted. Run 'yarn db:generate' locally and commit the result."
            git status --porcelain drizzle/
            git diff drizzle/
            exit 1
          fi

  # Single required status check for branch protection — internal jobs above can
  # be renamed/added/split without ever having to touch the protection rule.
  ci-summary:
    runs-on: ubuntu-latest
    needs: [changes, lint, check, test-server, test-client, db-migrate]
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
